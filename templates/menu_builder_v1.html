<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu Builder v1</title>
  <link rel="stylesheet" href="/static/css/builder.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/menu_builder_v1.css') }}">
</head>
<body>
  <div class="menu-composer-shell menu-composer-grid">
    <aside class="menu-dish-panel">
      <div class="menu-panel-header">
        <h2>Rätter</h2>
        <p class="menu-panel-hint">Sök och välj befintliga rätter till menyn.</p>
      </div>
      <div class="menu-browser-search">
        <label for="dishBrowserSearch">Sök rätt, tagg eller kategori…</label>
        <input id="dishBrowserSearch" type="search" placeholder="Sök rätt, tagg eller kategori…">
      </div>
      <div id="dishBrowserFilters" class="menu-browser-filters"></div>
      <div id="dishBrowserList" class="menu-dish-list"></div>
    </aside>

    <main class="menu-canvas-panel">
      <section class="menu-card menu-topbar">
        <div class="menu-topbar-copy">
          <a href="/builder-workspace-v1" class="menu-back-link">← Till Builder</a>
          <p class="menu-document-kicker">Meny</p>
          <h1 id="menuDocumentTitle">Bygg meny</h1>
          <p class="menu-meta">Bygg en meny av befintliga rätter och fortsätt där du slutade.</p>
          <p id="activeMenuMeta" class="menu-active-line">Öppna en meny för att fortsätta.</p>
        </div>
        <div class="menu-top-actions menu-action-row">
          <button id="btnNewMenu" class="menu-top-action-btn" type="button">Ny meny</button>
          <button id="btnOpenMenuPanel" class="menu-top-action-btn" type="button">Öppna meny</button>
          <button id="btnViewPrintActive" class="menu-top-action-btn" type="button" disabled>Visa / skriv ut</button>
        </div>
      </section>

      <section id="menuStartWrap" class="menu-card is-compact menu-start-wrap">
        <div class="menu-start-grid">
          <div class="menu-start-block">
            <h3>Ny meny</h3>
            <label class="menu-stack">Menynamn
              <input id="menuTitle" type="text" placeholder="Vårmeny">
            </label>
            <button id="btnCreateMenu" class="menu-inline-action-btn" type="button">Skapa meny</button>
            <div id="createMenuOut" class="menu-feedback" aria-live="polite"></div>
          </div>

          <div class="menu-start-block">
            <h3>Menybibliotek</h3>
            <div id="menuLibraryList" class="menu-library-list"></div>
            <div id="menuLibraryOut" class="menu-feedback" aria-live="polite"></div>
          </div>
        </div>
      </section>

      <section class="menu-document">
        <div class="menu-document-header">
          <div>
            <p class="menu-document-kicker">Meny</p>
            <h2 class="menu-document-title">Dokument</h2>
            <p id="menuSaveStatus" class="menu-document-status">Öppna en meny för att fortsätta.</p>
          </div>
          <div class="menu-document-controls">
            <label class="menu-document-section-input">Ny sektion
              <input id="newSectionName" type="text" placeholder="Ny sektion, t.ex. Förrätt, Varmrätt, Måndag lunch">
            </label>
            <button id="btnAddSection" class="menu-inline-action-btn" type="button">Lägg till</button>
          </div>
        </div>
        <div class="menu-document-body">
          <div id="menuSections" class="menu-sections"></div>
          <div id="menuSectionsOut" class="menu-feedback" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="dishPickerModal" class="modal hidden">
    <div class="modal-content modal-content-components">
      <div class="workspace-modal-header">
        <div>
          <p class="workspace-modal-kicker">Rättväljare</p>
          <h3>Lägg till rätt</h3>
        </div>
        <button id="dishPickerClose" type="button">Klar</button>
      </div>
      <p class="menu-meta" id="dishPickerSectionMeta"></p>
      <label>Sök rätter
        <input id="dishPickerSearch" type="text" placeholder="Sök rätt på namn">
      </label>
      <div id="dishPickerList" class="menu-picker-list"></div>
      <div id="dishPickerOut" class="menu-feedback" aria-live="polite"></div>
    </div>
  </div>

  <script src="/static/js/menu_builder_v1.js"></script>
</body>
</html>
