{% extends "ui/_layout/auth_base.html" %}

{% block page_title %}Återställ lösenord{% endblock %}

{% block content %}
  <div class="login-content">
    <h1 class="login-title">Återställ lösenord</h1>
    {% if message %}<p role="status">{{ message }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.forgot_password_request') }}" autocomplete="off">
      {{ csrf_token_input()|safe }}
      <label for="email">E-postadress</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <button type="submit">Skicka återställningslänk</button>
    </form>
  </div>
{% endblock %}
