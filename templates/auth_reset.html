{% extends "ui/_layout/auth_base.html" %}

{% block page_title %}Nytt lösenord{% endblock %}

{% block content %}
  <div class="login-content">
    <h1 class="login-title">Välj ett nytt lösenord</h1>
    {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('auth.reset_password_post') }}" autocomplete="off">
      {{ csrf_token_input()|safe }}
      <input type="hidden" name="token" value="{{ token }}">
      <label for="new_password">Nytt lösenord</label>
      <input id="new_password" name="new_password" type="password" minlength="6" required autocomplete="new-password">
      <label for="confirm_password">Bekräfta lösenord</label>
      <input id="confirm_password" name="confirm_password" type="password" minlength="6" required autocomplete="new-password">
      <button type="submit">Spara nytt lösenord</button>
    </form>
  </div>
{% endblock %}
