<div id="addComponentModal" class="modal hidden">
  <div class="modal-content modal-content-components">
    <div class="workspace-modal-header">
      <div>
        <p class="workspace-modal-kicker">Dish building</p>
        <h3>Lägg till komponent</h3>
      </div>
      <button id="addComponentModalClose" type="button">Klar</button>
    </div>

    <div class="workspace-modal-section-card">
      <p class="modal-section-title">Välj komponenter från biblioteket</p>
      <label>Sök komponenter
        <input id="builderPaletteSearch" type="text" placeholder="Sök återanvändbara komponenter">
      </label>
      <div id="builderComponentPalette" class="component-palette"></div>
    </div>
    <div class="workspace-inline-actions workspace-builder-primary-actions">
      <button id="btnAddComponent" type="button">Skapa ny komponent</button>
    </div>

  </div>
</div>
