<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLANERA - Kommun UX 1</title>
  <style>
    :root {
      --bg: #eaf7f8;
      --bg-2: #f5fbfb;
      --panel: rgba(255, 255, 255, 0.92);
      --panel-strong: #ffffff;
      --ink: #101828;
      --muted: #3f6476;
      --muted-2: #7b94a4;
      --line: rgba(3, 85, 144, 0.14);
      --line-strong: rgba(3, 85, 144, 0.24);
      --accent: #00aeb8;
      --accent-2: #035590;
      --accent-3: #02aec3;
      --accent-soft: rgba(0, 174, 184, 0.12);
      --accent-soft-2: rgba(2, 174, 195, 0.16);
      --warn: #f1e15e;
      --shadow: 0 24px 70px rgba(7, 20, 38, 0.14);
      --shadow-soft: 0 14px 32px rgba(7, 20, 38, 0.09);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --tap: 56px;
      --content: 1180px;
      --sidebar: 184px;
    }

    [data-theme="dark"] {
      --bg: #071426;
      --bg-2: #0b1f34;
      --panel: rgba(11, 31, 52, 0.88);
      --panel-strong: #0b1f34;
      --ink: #eaf7f8;
      --muted: #9bb7c6;
      --muted-2: #6c8796;
      --line: rgba(2, 174, 195, 0.18);
      --line-strong: rgba(2, 174, 195, 0.28);
      --accent: #02aec3;
      --accent-2: #00aeb8;
      --accent-3: #035590;
      --accent-soft: rgba(2, 174, 195, 0.14);
      --accent-soft-2: rgba(2, 174, 195, 0.18);
      --warn: #f1e15e;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
      --shadow-soft: 0 16px 34px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(0, 174, 184, 0.22), transparent 30%),
        radial-gradient(circle at top right, rgba(2, 174, 195, 0.14), transparent 26%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    /* =========================================================
       YUPLAN APP SHELL — LOCKED
       Do not override from screen-specific CSS.
       ========================================================= */

    .shell {
      min-height: 100%;
      display: flex;
      justify-content: center;
      padding: 22px;
    }

    .app {
      width: min(var(--content), 100%);
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: max-content minmax(0, 1fr);
      gap: 18px;
    }

    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 62px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(243, 248, 251, 0.98), rgba(234, 242, 247, 0.97));
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    #app[data-theme="dark"] .topbar {
      background: linear-gradient(180deg, rgba(11, 31, 52, 0.98), rgba(7, 20, 38, 0.96));
      border-color: rgba(2, 174, 195, 0.14);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      position: relative;
      z-index: 1;
      margin-left: 0;
    }

    .topbar-brand__mark {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      background: transparent;
      border: 0;
      display: block;
      overflow: hidden;
      margin: 0;
      object-fit: contain;
    }

    .topbar-brand__copy {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .topbar-brand__copy strong {
      display: block;
      font-size: 0.98rem;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }

    .topbar-brand__copy span {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .status-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .status-pill strong {
      color: var(--ink);
      font-weight: 700;
    }

    .status-pill.selected {
      border-color: rgba(2, 174, 195, 0.24);
      background: rgba(2, 174, 195, 0.10);
      color: var(--accent-2);
    }

    .status-date {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.74);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      font-size: 0.92rem;
    }

    .status-avatar {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.82);
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-shadow: var(--shadow-soft);
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    [data-theme="light"] .theme-toggle {
      background: linear-gradient(180deg, #f7fbfb, #eef5f6);
      border-color: rgba(7, 20, 38, 0.10);
      color: #035590;
    }

    [data-theme="dark"] .theme-toggle {
      background: linear-gradient(180deg, #0f2941, #0b1f34);
      border-color: rgba(241, 225, 94, 0.18);
      color: #f1e15e;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .shell-layout {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .shell-sidebar {
      position: sticky;
      top: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 14px;
      border-radius: 28px;
      border: 1px solid rgba(2, 174, 195, 0.12);
      background: linear-gradient(180deg, #0b1f34 0%, #091a2c 100%);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
      min-height: 100%;
    }

    [data-theme="dark"] .shell-sidebar {
      background: linear-gradient(180deg, #0b1f34 0%, #091a2c 100%);
    }

    .shell-sidebar,
    .shell-sidebar__brand-copy span,
    .shell-nav__item,
    .shell-helper__text {
      color: rgba(234, 247, 248, 0.88);
    }

    .shell-sidebar__context {
      display: grid;
      gap: 3px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(2, 174, 195, 0.12);
    }

    .shell-sidebar__context strong {
      display: block;
      font-size: 0.98rem;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .shell-sidebar__context span {
      display: block;
      font-size: 0.8rem;
      color: rgba(234, 247, 248, 0.68);
      line-height: 1.1;
    }

    .shell-nav {
      display: grid;
      gap: 4px;
    }

    .shell-nav__item {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(234, 247, 248, 0.78);
      font-size: 0.96rem;
      font-weight: 600;
      text-align: left;
    }

    .shell-nav__item.active {
      background: linear-gradient(180deg, rgba(2, 174, 195, 0.18), rgba(2, 174, 195, 0.10));
      border-color: rgba(2, 174, 195, 0.22);
      color: #eaf7f8;
      box-shadow: none;
    }

    .shell-sidebar__bottom {
      margin-top: auto;
      display: grid;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid rgba(2, 174, 195, 0.12);
    }

    .shell-sidebar__mascot-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .shell-sidebar__mascot {
      width: 34px;
      height: 34px;
      border-radius: 0;
      overflow: visible;
      background: transparent;
      border: 0;
      flex: 0 0 auto;
    }

    .shell-sidebar__mascot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .shell-sidebar__footer {
      color: rgba(234, 247, 248, 0.62);
      line-height: 1.3;
      font-size: 0.76rem;
    }

    .topbar-title {
      display: none;
      align-items: center;
      min-height: 40px;
      padding: 0 2px;
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-2);
      white-space: nowrap;
    }

    /*
      SCREEN CONTENT STARTS HERE.
      Do not override YUPLAN APP SHELL from this section.
    */

    #app[data-screen="start"] .panel {
      background: linear-gradient(180deg, rgba(248, 252, 252, 0.92), rgba(238, 247, 248, 0.94));
      border-color: rgba(3, 85, 144, 0.10);
      box-shadow: 0 20px 52px rgba(7, 20, 38, 0.10);
    }

    #app[data-screen="start"] .panel-inner {
      padding: 22px;
    }

    #app[data-theme="light"] .planera-start-sidebar {
      background: linear-gradient(180deg, rgba(229, 244, 247, 0.98), rgba(214, 236, 242, 0.98));
      border-color: rgba(3, 85, 144, 0.12);
      color: var(--ink);
    }

    #app[data-theme="dark"] .planera-start-sidebar {
      background: linear-gradient(180deg, #0b1f34 0%, #091a2c 100%);
      border-color: rgba(2, 174, 195, 0.14);
      color: rgba(234, 247, 248, 0.88);
    }

    .planera-start-shell {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .planera-start-sidebar {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding: 16px 14px;
      border-radius: 28px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(14px);
    }

    #app[data-theme="light"] .planera-start-sidebar .planera-start-sidebar__brand-copy span,
    #app[data-theme="light"] .planera-start-sidebar .planera-start-sidebar__item,
    #app[data-theme="light"] .planera-start-sidebar .planera-start-sidebar__settings {
      color: #244a62;
    }

    #app[data-theme="light"] .planera-start-sidebar .planera-start-sidebar__item.active {
      color: var(--accent-2);
    }

    .planera-start-sidebar__brand {
      display: none;
    }

    .planera-start-sidebar__brand-mark {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      background: transparent;
    }

    .planera-start-sidebar__brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .planera-start-sidebar__brand-copy strong {
      display: block;
      font-size: 0.88rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .planera-start-sidebar__brand-copy span {
      display: block;
      margin-top: 2px;
      font-size: 0.84rem;
      color: inherit;
      opacity: 0.78;
    }

    .planera-start-sidebar__nav {
      display: grid;
      gap: 6px;
      margin-top: 0;
    }

    .planera-start-sidebar__item {
      min-height: 42px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      font-weight: 650;
      color: inherit;
      opacity: 0.88;
    }

    .planera-start-sidebar__item.active {
      background: linear-gradient(180deg, rgba(2, 174, 195, 0.18), rgba(2, 174, 195, 0.10));
      border-color: rgba(2, 174, 195, 0.24);
      color: var(--accent-2);
      opacity: 1;
    }

    .planera-start-sidebar__bottom {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(3, 85, 144, 0.10);
    }

    #app[data-theme="dark"] .planera-start-sidebar__bottom {
      border-top-color: rgba(2, 174, 195, 0.12);
    }

    #app[data-theme="dark"][data-screen="start"] {
      color: var(--ink);
    }

    #app[data-theme="dark"] .topbar-title {
      color: #eaf7f8;
    }

    #app[data-theme="dark"] .panel {
      background: linear-gradient(180deg, rgba(9, 24, 43, 0.96), rgba(7, 20, 38, 0.98));
      border-color: rgba(2, 174, 195, 0.14);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
    }

    #app[data-theme="dark"][data-screen="start"] .planera-start-shell {
      color: var(--ink);
    }

    #app[data-theme="dark"][data-screen="start"] .planera-start-date,
    #app[data-theme="dark"][data-screen="start"] .planera-start-lunch__kicker,
    #app[data-theme="dark"][data-screen="start"] .planera-start-lunch__meta,
    #app[data-theme="dark"][data-screen="start"] .planera-start-option__title,
    #app[data-theme="dark"][data-screen="start"] .planera-start-row__value {
      color: #eaf7f8;
    }

    #app[data-theme="dark"][data-screen="start"] .planera-start-weeklabel {
      background: linear-gradient(180deg, rgba(16, 41, 69, 0.96), rgba(11, 31, 52, 0.96));
      border-color: rgba(2, 174, 195, 0.18);
      color: #eaf7f8;
    }

    #app[data-theme="dark"][data-screen="start"] .planera-start-weekbar .arrow,
    #app[data-theme="dark"][data-screen="start"] .planera-start-weekbar .weekday {
      background: rgba(16, 41, 69, 0.72);
      border-color: rgba(2, 174, 195, 0.16);
      color: #eaf7f8;
    }

    #app[data-theme="dark"][data-screen="start"] .planera-start-weekbar .weekday.current,
    #app[data-theme="dark"][data-screen="start"] .planera-start-weekbar .weekday.today {
      color: var(--accent);
    }

    #app[data-theme="dark"][data-screen="start"] .planera-start-weekbar .weekday.current strong,
    #app[data-theme="dark"][data-screen="start"] .planera-start-weekbar .weekday.today strong {
      color: var(--accent);
    }

    #app[data-theme="dark"][data-screen="start"] .planera-start-lunch {
      background: linear-gradient(180deg, rgba(11, 31, 52, 0.98), rgba(7, 20, 38, 0.96));
      border-color: rgba(2, 174, 195, 0.16);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
    }

    #app[data-theme="dark"][data-screen="start"] .planera-start-option__text,
    #app[data-theme="dark"][data-screen="start"] .planera-start-row__chev,
    #app[data-theme="dark"][data-screen="start"] .planera-start-row__label,
    #app[data-theme="dark"][data-screen="start"] .planera-start-sidebar__settings {
      color: rgba(234, 247, 248, 0.72);
    }

    #app[data-theme="dark"][data-screen="start"] .planera-start-secondary,
    #app[data-theme="dark"][data-screen="start"] .planera-start-row {
      border-top-color: rgba(2, 174, 195, 0.14);
      border-bottom-color: rgba(2, 174, 195, 0.14);
    }

    #app[data-theme="dark"][data-screen="start"] .planera-start-row:hover,
    #app[data-theme="dark"][data-screen="start"] .planera-start-row:focus-visible {
      background: rgba(2, 174, 195, 0.04);
    }

    .planera-start-sidebar__settings {
      min-height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      opacity: 0.68;
      text-align: left;
      font-size: 0.84rem;
      font-weight: 650;
    }

    .planera-start-main {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .planera-start-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .planera-start-date {
      font-size: clamp(2.45rem, 1.05vw + 1.65rem, 2.75rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .planera-start-weekbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.62);
      overflow: auto;
      scrollbar-width: none;
    }

    #app[data-theme="light"] .planera-start-weekbar {
      background: linear-gradient(180deg, rgba(247, 251, 251, 0.86), rgba(238, 247, 248, 0.92));
    }

    #app[data-theme="dark"] .planera-start-weekbar {
      background: rgba(11, 31, 52, 0.92);
      border-color: rgba(2, 174, 195, 0.14);
    }

    .planera-start-weekbar::-webkit-scrollbar { display: none; }

    .planera-start-weeklabel {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.74);
      color: var(--accent-2);
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .planera-start-weekbar .arrow,
    .planera-start-weekbar .weekday {
      flex: 0 0 auto;
    }

    .planera-start-weekbar .arrow {
      min-width: 44px;
      width: 44px;
      height: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
      font-size: 1.15rem;
      line-height: 1;
      box-sizing: border-box;
    }

    .planera-start-weekbar .weekday {
      min-width: 84px;
    }

    #app[data-theme="light"] .planera-start-weekbar .arrow {
      background: linear-gradient(180deg, rgba(247, 251, 251, 0.92), rgba(238, 247, 248, 0.98));
      border-color: rgba(3, 85, 144, 0.12);
      color: var(--accent-2);
      box-shadow: 0 8px 18px rgba(7, 20, 38, 0.06);
    }

    #app[data-theme="dark"] .planera-start-weekbar .arrow {
      background: linear-gradient(180deg, rgba(16, 41, 69, 0.92), rgba(11, 31, 52, 0.96));
      border-color: rgba(2, 174, 195, 0.18);
      color: #eaf7f8;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
    }

    #app[data-theme="light"] .planera-start-weekbar .arrow:hover,
    #app[data-theme="light"] .planera-start-weekbar .arrow:focus-visible,
    #app[data-theme="dark"] .planera-start-weekbar .arrow:hover,
    #app[data-theme="dark"] .planera-start-weekbar .arrow:focus-visible {
      outline: none;
      border-color: rgba(2, 174, 195, 0.34);
      box-shadow: 0 0 0 4px rgba(2, 174, 195, 0.10);
    }

    .planera-start-weekbar .weekday.current {
      border-color: rgba(2, 174, 195, 0.26);
      background: rgba(2, 174, 195, 0.12);
      color: var(--accent-2);
      box-shadow: inset 0 0 0 1px rgba(2, 174, 195, 0.10);
    }

    .planera-start-weekbar .weekday.current strong {
      color: var(--accent-2);
    }

    #app[data-theme="dark"] .planera-start-weekbar .weekday.current {
      background: linear-gradient(180deg, rgba(2, 174, 195, 0.24), rgba(2, 174, 195, 0.18));
      border-color: rgba(2, 174, 195, 0.34);
      color: #eaf7f8;
      box-shadow: inset 0 0 0 1px rgba(2, 174, 195, 0.14);
    }

    #app[data-theme="dark"] .planera-start-weekbar .weekday.current strong {
      color: #eaf7f8;
    }

    .planera-start-weekbar .weekday.today::after {
      margin-top: 0;
      font-size: 0.62rem;
      letter-spacing: 0.11em;
    }

    #app[data-theme="dark"] .planera-start-weekbar .weekday.today::after {
      color: var(--accent);
    }

    .planera-start-lunch {
      display: grid;
      gap: 12px;
      padding: 16px 20px 16px;
      border-radius: 28px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(242, 249, 250, 0.96));
      box-shadow: var(--shadow-soft);
    }

    #app[data-theme="light"] .planera-start-lunch {
      background: linear-gradient(180deg, rgba(248, 252, 252, 0.94), rgba(240, 247, 248, 0.98));
      border-color: rgba(3, 85, 144, 0.10);
      box-shadow: 0 14px 32px rgba(7, 20, 38, 0.08);
    }

    #app[data-theme="dark"] .planera-start-lunch {
      background: linear-gradient(180deg, rgba(11, 31, 52, 0.98), rgba(7, 20, 38, 0.96));

    .success-card {
      width: min(620px, 100%);
      text-align: center;
      padding: 26px;
    }

    .success-mark {
      width: 78px;
      height: 78px;
      border-radius: 24px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
      box-shadow: 0 18px 36px rgba(2, 174, 195, 0.24);
      font-size: 2rem;
      font-weight: 900;
    }

    .success-title {
      font-size: clamp(2rem, 2vw + 1.1rem, 3rem);
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .success-copy {
      margin: 12px auto 0;
      max-width: 42ch;
      color: var(--muted);
      line-height: 1.55;
    }

    .hidden { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1040px) {
      .grid,
      .summary-grid,
      .alt-grid {
        grid-template-columns: 1fr;
      }

      .hero-card,
      .small-card {
        grid-column: auto;
      }

      .screen-head {
        flex-direction: column;
      }

      .footer-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 720px) {
      .shell { padding: 12px; }
      .panel-inner { padding: 18px; }
      .topbar { padding: 14px 16px; }
      .status-strip { justify-content: flex-start; }
      .hero-card,
      .alt-card,
      .summary-panel,
      .success-state {
        border-radius: 24px;
      }
      .hero-top {
        flex-direction: column;
        align-items: flex-start;
      }
      .weekbar { padding: 10px; }
      .weekday {
        min-width: 96px;
        min-height: 62px;
      }
      .chip { align-items: flex-start; }
      .chip .right { align-self: center; }
      .summary-stat { flex-direction: column; }
      .summary-stat .value { align-self: flex-start; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="app" id="app" data-screen="start">
      <header class="topbar" aria-label="Yuplan header">
        <div class="topbar-brand">
          <img class="topbar-brand__mark" src="../../static/brand/v1/logo/yuplan-mark-primary.svg" alt="Yuplan">
          <div class="topbar-brand__copy">
            <strong>Yuplan</strong>
            <span>· Planera</span>
          </div>
        </div>
        <div class="status-strip" aria-label="Progress and context">
          <div class="status-date sr-only" id="statusDay">Tisdag 8 september</div>
          <div class="status-avatar" aria-hidden="true">HJ</div>
          <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Växla till dark mode"></button>
        </div>
      </header>

      <main class="main panel">
        <div class="panel-inner">
          <section class="screen active planera-start" id="screen-start" aria-labelledby="start-title">
            <div class="planera-start-shell">
              <aside class="planera-start-sidebar" aria-label="Yuplan navigation">
                <div class="shell-sidebar__context">
                  <strong>Centralköket</strong>
                  <span>Kommun</span>
                </div>
                <nav class="planera-start-sidebar__nav" aria-label="Visuell navigering">
                  <button class="planera-start-sidebar__item" type="button">Översikt</button>
                  <button class="planera-start-sidebar__item active" type="button" aria-current="page">Planera</button>
                  <button class="planera-start-sidebar__item" type="button">Meny</button>
                  <button class="planera-start-sidebar__item" type="button">Veckovy</button>
                  <button class="planera-start-sidebar__item" type="button">Rapporter</button>
                </nav>
                <div class="planera-start-sidebar__bottom">
                  <button class="planera-start-sidebar__settings" type="button">Inställningar</button>
                </div>
              </aside>

              <div class="planera-start-main">
                <div class="planera-start-head">
                  <h1 class="planera-start-date" id="start-title">Tisdag 8 september</h1>
                </div>

                <div class="planera-start-weekbar" role="toolbar" aria-label="Veckoväljare">
                  <button class="arrow" type="button" aria-label="Föregående vecka">‹</button>
                  <span class="planera-start-weeklabel">Vecka 37</span>
                  <button class="weekday" type="button"><span>Mån</span><strong>7</strong></button>
                  <button class="weekday current today" type="button" aria-current="date"><span>Tis</span><strong>8</strong></button>
                  <button class="weekday" type="button"><span>Ons</span><strong>9</strong></button>
                  <button class="weekday" type="button"><span>Tors</span><strong>10</strong></button>
                  <button class="weekday" type="button"><span>Fre</span><strong>11</strong></button>
                  <button class="weekday" type="button"><span>Lör</span><strong>12</strong></button>
                  <button class="weekday" type="button"><span>Sön</span><strong>13</strong></button>
                  <button class="arrow" type="button" aria-label="Nästa vecka">›</button>
                </div>

                <section class="planera-start-lunch" aria-label="Lunch">
                  <div class="planera-start-lunch__head">
                    <div class="planera-start-lunch__kicker">Lunch</div>
                    <div class="planera-start-lunch__meta">18 mottagande enheter · 273 portioner</div>
                  </div>

                  <div class="planera-start-lunch__options">
                    <article class="planera-start-option planera-start-option--active">
                      <div class="planera-start-option__kicker">ALT 1</div>
                      <div class="planera-start-option__title">Fläskkarré</div>
                      <div class="planera-start-option__text">Potatismos · Gräddsås</div>
                    </article>

                    <div class="planera-start-divider" aria-hidden="true"></div>

                    <article class="planera-start-option">
                      <div class="planera-start-option__kicker">ALT 2</div>
                      <div class="planera-start-option__title">Kokt torsk</div>
                      <div class="planera-start-option__text">Äggsås · Kokt potatis</div>
                    </article>
                  </div>

                  <div class="planera-start-lunch__footer">
                    <button class="plan-btn planera-start-cta" type="button" data-jump="workspace">Planera lunch →</button>
                  </div>
                </section>

                <section class="planera-start-secondary" aria-label="Senare idag">
                  <button class="planera-start-row" type="button">
                    <span class="planera-start-row__label">Kväll</span>
                    <span class="planera-start-row__value">Köttfärssoppa</span>
                    <span class="planera-start-row__chev">›</span>
                  </button>
                  <button class="planera-start-row" type="button">
                    <span class="planera-start-row__label">Dessert</span>
                    <span class="planera-start-row__value">Äppelpaj</span>
                    <span class="planera-start-row__chev">›</span>
                  </button>
                  <button class="planera-start-row" type="button">
                    <span class="planera-start-row__label">Tillägg</span>
                    <span class="planera-start-row__value">Sallad · Mos · Övriga tillval</span>
                    <span class="planera-start-row__chev">›</span>
                  </button>
                </section>
              </div>
            </div>
          </section>

          <section class="screen" id="screen-workspace" aria-labelledby="workspace-title">
            <div class="workspace">
              <div class="workspace-header">
                <div class="workspace-headline">
                  <div class="workspace-kicker">Planera dagen</div>
                  <h2 class="title" id="workspace-title">Tisdag 8 september</h2>
                  <div class="workspace-subtitle" id="workspaceProgress">4 planeringsobjekt · 0 av 4 planerade</div>
                </div>
                <a class="back-btn" href="#" data-jump="start">← Tillbaka</a>
              </div>

              <div class="workspace-nav" id="planningNav" aria-label="Dagens planeringsobjekt"></div>

              <div class="workspace-context" id="planningContext" aria-live="polite"></div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script>
    const app = document.getElementById('app');
    const screens = {
      start: document.getElementById('screen-start'),
      workspace: document.getElementById('screen-workspace'),
    };
    const themeToggle = document.getElementById('themeToggle');
    const planningNav = document.getElementById('planningNav');
    const planningContext = document.getElementById('planningContext');
    const workspaceProgress = document.getElementById('workspaceProgress');

    const planningItems = [
      {
        id: 'lunchAlt1',
        slot: 'Lunch',
        label: 'Alt 1',
        dish: 'Fläskkarré',
        components: 'Potatismos · Gräddsås',
        recipientCount: 182,
        cohorts: [
          { count: 6, needs: ['timbal'] },
          { count: 1, needs: ['timbal', 'glutenfri'] },
          { count: 1, needs: ['timbal', 'grovPate'] },
          { count: 3, needs: ['grovPate'] },
          { count: 8, needs: ['glutenfri'] },
          { count: 12, needs: ['vegetarisk'] },
          { count: 2, needs: ['aggfri'] },
        ],
      },
      {
        id: 'lunchAlt2',
        slot: 'Lunch',
        label: 'Alt 2',
        dish: 'Kokt torsk',
        components: 'Äggsås · Kokt potatis',
        recipientCount: 91,
        cohorts: [
          { count: 4, needs: ['fiskfri'] },
          { count: 2, needs: ['laktosfri'] },
          { count: 1, needs: ['laktosfri', 'glutenfri'] },
          { count: 4, needs: ['laktosfri', 'aggfri'] },
          { count: 3, needs: ['glutenfri'] },
          { count: 2, needs: ['mjolkproteinfri'] },
          { count: 1, needs: ['aggfri'] },
          { count: 4, needs: ['vegetarisk'] },
        ],
      },
      {
        id: 'evening',
        slot: 'Övrigt',
        label: 'Kväll',
        dish: 'Köttfärssoppa',
        components: '',
        recipientCount: 273,
        cohorts: [
          { count: 7, needs: ['timbal'] },
          { count: 5, needs: ['glutenfri'] },
          { count: 6, needs: ['laktosfri'] },
          { count: 8, needs: ['vegetarisk'] },
          { count: 3, needs: ['mjolkproteinfri'] },
          { count: 4, needs: ['aggfri'] },
          { count: 2, needs: ['flytande'] },
        ],
      },
      {
        id: 'dessert',
        slot: 'Övrigt',
        label: 'Dessert',
        dish: 'Äppelpaj',
        components: '',
        recipientCount: 273,
        cohorts: [
          { count: 5, needs: ['glutenfri'] },
          { count: 6, needs: ['laktosfri'] },
          { count: 3, needs: ['mjolkproteinfri'] },
          { count: 4, needs: ['aggfri'] },
          { count: 2, needs: ['diabetes'] },
          { count: 4, needs: ['vegetarisk'] },
        ],
      },
    ];

    const needDefinitions = {
      timbal: 'Timbal',
      grovPate: 'Grov paté',
      glutenfri: 'Glutenfri',
      laktosfri: 'Laktosfri',
      vegetarisk: 'Vegetarisk',
      aggfri: 'Äggfri',
      fiskfri: 'Fiskfri',
      mjolkproteinfri: 'Mjölkproteinfri',
      flytande: 'Flytande kost',
      diabetes: 'Diabetes/anpassad',
    };

    // Mock-only taxonomy for the workspace shell. Not canonical production taxonomy.
    const needsOrder = Object.keys(needDefinitions);

    const planningSlots = ['Lunch', 'Övrigt'];
    const planningItemsById = Object.fromEntries(planningItems.map((item) => [item.id, item]));
    const planningState = Object.fromEntries(
      planningItems.map((item) => [item.id, {
        selectedNeeds: new Set(),
        expandedNeed: null,
      }]),
    );

    let screen = 'start';
    let activePlanningItemId = 'lunchAlt1';
    let theme = 'light';

    function setTheme(nextTheme) {
      theme = nextTheme === 'dark' ? 'dark' : 'light';
      app.dataset.theme = theme;
      document.documentElement.dataset.theme = theme;
      if (themeToggle) {
        themeToggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
        themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Byt till ljust läge' : 'Byt till mörkt läge');
        themeToggle.innerHTML = theme === 'dark'
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.9v2.1"></path><path d="M12 19v2.1"></path><path d="M4.95 4.95l1.5 1.5"></path><path d="M17.55 17.55l1.5 1.5"></path><path d="M2.9 12h2.1"></path><path d="M19 12h2.1"></path><path d="M4.95 19.05l1.5-1.5"></path><path d="M17.55 6.45l1.5-1.5"></path></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12.7A8.5 8.5 0 1 1 11.3 3.5a7 7 0 0 0 9.2 9.2Z"></path></svg>';
      }
    }

    function setScreen(next) {
      screen = next;
      Object.entries(screens).forEach(([name, el]) => {
        el.classList.toggle('active', name === next);
      });
      app.dataset.screen = next;
      if (next === 'workspace') {
        renderWorkspace();
      }
      window.scrollTo({ top: 0 });
    }

    function getActivePlanningItem() {
      return planningItemsById[activePlanningItemId] || planningItems[0];
    }

    function getPlanningItemState(itemId) {
      if (!planningState[itemId]) {
        planningState[itemId] = {
          selectedNeeds: new Set(),
          expandedNeed: null,
        };
      }
      return planningState[itemId];
    }

    function getActivePlanningState() {
      return getPlanningItemState(activePlanningItemId);
    }

    function getPlannedCount() {
      return planningItems.reduce((count, item) => count + (getPlanningItemState(item.id).planned ? 1 : 0), 0);
    }

    function deriveRelevantNeeds(item) {
      const counts = new Map();

      item.cohorts.forEach((cohort) => {
        cohort.needs.forEach((needId) => {
          const current = counts.get(needId) || 0;
          counts.set(needId, current + cohort.count);
        });
      });

      return needsOrder
        .map((needId) => ({
          id: needId,
          label: needDefinitions[needId],
          count: counts.get(needId) || 0,
        }))
        .filter((need) => need.count > 0);
    }

    function deriveAffectedCount(item, selectedNeedIds) {
      if (!selectedNeedIds.size) return 0;

      return item.cohorts.reduce((total, cohort) => {
        const affected = cohort.needs.some((needId) => selectedNeedIds.has(needId));
        return affected ? total + cohort.count : total;
      }, 0);
    }

    function setItemPlanned(itemId, planned) {
      const state = getPlanningItemState(itemId);
      if (!state) return;
      state.planned = planned;
      renderWorkspace();
    }

    function buildNeedLabel(needIds) {
      return needIds.map((needId) => needDefinitions[needId] || needId).join(' + ');
    }

    function getNeedBreakdown(item, needId) {
      return item.cohorts
        .filter((cohort) => cohort.needs.includes(needId))
        .map((cohort) => ({
          label: buildNeedLabel(cohort.needs),
          count: cohort.count,
        }));
    }

    function getActiveCounts(item, selectedNeedIds) {
      const adjustments = deriveAffectedCount(item, selectedNeedIds);
      const total = item.recipientCount;
      return {
        total,
        adjustments,
        normal: total - adjustments,
      };
    }

    function setActivePlanningItem(itemId) {
      if (!planningItemsById[itemId]) return;
      activePlanningItemId = itemId;
      renderWorkspace();
    }

    function renderPlanningNav() {
      planningNav.innerHTML = '';

      const progressCount = getPlannedCount();
      const summary = document.createElement('div');
      summary.className = 'workspace-nav__summary';

      const summaryRow = document.createElement('div');
      summaryRow.className = 'workspace-nav__summary-row';

      const summaryLabel = document.createElement('div');
      summaryLabel.className = 'workspace-nav__summary-label';
      summaryLabel.textContent = 'Dagens planering';

      const summaryText = document.createElement('div');
      summaryText.className = 'workspace-nav__summary-text';
      summaryText.textContent = `${progressCount} av ${planningItems.length} planerade`;

      summaryRow.append(summaryLabel, summaryText);

      const track = document.createElement('div');
      track.className = 'workspace-nav__track';

      planningItems.forEach((item) => {
        const segment = document.createElement('span');
        const itemState = getPlanningItemState(item.id);
        segment.className = `workspace-nav__segment${itemState.planned ? ' planned' : ''}${item.id === activePlanningItemId ? ' active' : ''}`;
        segment.setAttribute('aria-hidden', 'true');
        track.append(segment);
      });

      summary.append(summaryRow, track);
      planningNav.append(summary);

      const rail = document.createElement('div');
      rail.className = 'workspace-nav__row';

      planningItems.forEach((item) => {
        const itemState = getPlanningItemState(item.id);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'workspace-nav__item';
        button.setAttribute('aria-pressed', String(item.id === activePlanningItemId));
        button.dataset.active = String(item.id === activePlanningItemId);
        button.dataset.planned = String(Boolean(itemState.planned));
        const itemTitle = item.slot === 'Lunch' ? `Lunch · ${item.label}` : item.label;
        button.innerHTML = `<span class="workspace-nav__item-label">${itemTitle}</span><span class="workspace-nav__item-state">${itemState.planned ? '✓ Planerad' : '○ Ej planerad'}</span>`;
        button.addEventListener('click', () => setActivePlanningItem(item.id));
        rail.append(button);
      });

      planningNav.append(rail);
    }

    function toggleSelectedNeed(needId) {
      const state = getActivePlanningState();
      if (state.selectedNeeds.has(needId)) {
        state.selectedNeeds.delete(needId);
      } else {
        state.selectedNeeds.add(needId);
      }
      state.planned = false;
      renderWorkspace();
    }

    function toggleExpandedNeed(needId) {
      const state = getActivePlanningState();
      state.expandedNeed = state.expandedNeed === needId ? null : needId;
      renderWorkspace();
    }

    function renderNeedRow(item, need, state) {
      const isSelected = state.selectedNeeds.has(need.id);
      const isExpanded = state.expandedNeed === need.id;
      const row = document.createElement('button');
      row.type = 'button';
      row.className = `workspace-needs__row${isSelected ? ' selected' : ''}`;
      row.setAttribute('aria-pressed', String(isSelected));
      row.setAttribute('aria-label', `${need.label}, ${need.count} personer`);
      row.addEventListener('click', () => toggleSelectedNeed(need.id));

      const checkbox = document.createElement('span');
      checkbox.className = 'workspace-needs__checkbox';
      checkbox.textContent = isSelected ? '✓' : '□';

      const label = document.createElement('span');
      label.className = 'workspace-needs__name';
      label.textContent = need.label;

      const count = document.createElement('span');
      count.className = 'workspace-needs__count';
      count.textContent = `${need.count} pers.`;

      const disclosure = document.createElement('button');
      disclosure.type = 'button';
      disclosure.className = 'workspace-needs__chev';
      disclosure.setAttribute('aria-label', `${isExpanded ? 'Dölj' : 'Visa'} detaljer för ${need.label}`);
      disclosure.setAttribute('aria-expanded', String(isExpanded));
      disclosure.textContent = isExpanded ? '⌄' : '›';
      disclosure.addEventListener('click', (event) => {
        event.stopPropagation();
        toggleExpandedNeed(need.id);
      });

      row.append(checkbox, label, count, disclosure);

      if (!isExpanded) {
        return row;
      }

      const details = document.createElement('div');
      details.className = 'workspace-needs__details';

      getNeedBreakdown(item, need.id).forEach((breakdown) => {
        const detailRow = document.createElement('div');
        detailRow.className = 'workspace-needs__detail-row';
        detailRow.innerHTML = `<span class="workspace-needs__detail-label">${breakdown.label}</span><span class="workspace-needs__detail-count">${breakdown.count}</span>`;
        details.append(detailRow);
      });

      const fragment = document.createDocumentFragment();
      fragment.append(row, details);
      return fragment;
    }

    function renderActivePlanningItem() {
      const item = getActivePlanningItem();
      const state = getActivePlanningState();
      const relevantNeeds = deriveRelevantNeeds(item);
      const counts = getActiveCounts(item, state.selectedNeeds);
      const progressCount = getPlannedCount();
      const progressText = `${planningItems.length} planeringsobjekt · ${progressCount} av ${planningItems.length} planerade`;
      if (workspaceProgress) {
        workspaceProgress.textContent = progressText;
      }
      const plannedLabel = '✓ Planerad';
      const ctaLabel = state.planned
        ? plannedLabel
        : (counts.adjustments === 0
          ? 'Alla kan äta rätten som den är →'
          : `Bekräfta – ${counts.adjustments} anpassningar →`);
      const context = [
        '<div class="workspace-context__meta">',
        `<div class="workspace-context__slot">${item.slot} · ${item.label}</div>`,
        `<div class="workspace-context__title">${item.dish}</div>`,
        item.components ? `<div class="workspace-context__sub">${item.components}</div>` : '',
        `<div class="workspace-context__count">${item.recipientCount} personer</div>`,
        `<div class="workspace-context__state${state.planned ? ' planned' : ''}">${state.planned ? '✓ Planerad' : '○ Ej planerad'}</div>`,
        '</div>',
        '<div class="workspace-context__question">Vilka kan inte äta den här rätten som den är?</div>',
        '<div class="workspace-context__sub">Markera de kostbehov som kräver en anpassning.</div>',
        `<div class="workspace-summary"><div class="workspace-summary__counts"><strong>${counts.total} totalt</strong><span>${counts.normal} normalkost</span><span>${counts.adjustments} anpassningar</span></div><div class="workspace-summary__action">${state.planned ? '<span class="workspace-summary__planned">✓ Planerad</span>' : `<button class="workspace-summary__cta" type="button" id="confirmCurrentItemBtn">${ctaLabel}</button>`}</div></div>`,
        '<div class="workspace-needs">',
        '<div class="workspace-needs__head">',
        '<div class="workspace-needs__title">Relevanta kostbehov</div>',
        `<div class="workspace-needs__hint">Visar behov bland de ${item.recipientCount} personer som ska ha den här rätten.</div>`,
        '</div>',
        '</div>',
      ].join('');

      planningContext.innerHTML = context;

      const needsList = document.createElement('div');
      needsList.className = 'workspace-needs__list';

      if (!relevantNeeds.length) {
        const empty = document.createElement('div');
        empty.className = 'workspace-needs__empty';
        empty.textContent = 'Inga registrerade kostbehov för denna rätts mottagare.';
        needsList.append(empty);
      } else {
        relevantNeeds.forEach((need) => {
          needsList.append(renderNeedRow(item, need, state));
        });
      }

      planningContext.append(needsList);

      const confirmButton = document.getElementById('confirmCurrentItemBtn');
      if (confirmButton) {
        confirmButton.addEventListener('click', () => setItemPlanned(item.id, true));
      }
    }

    function renderWorkspace() {
      renderPlanningNav();
      renderActivePlanningItem();
      app.dataset.screen = screen;
    }

    document.querySelectorAll('[data-jump]').forEach((control) => {
      control.addEventListener('click', (event) => {
        event.preventDefault();
        const target = control.dataset.jump;
        if (target === 'workspace') {
          activePlanningItemId = 'lunchAlt1';
        }
        setScreen(target);
      });
    });

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        setTheme(theme === 'dark' ? 'light' : 'dark');
      });
    }

    console.assert(deriveRelevantNeeds(planningItemsById.lunchAlt1).find((need) => need.id === 'timbal')?.count === 8, 'Alt 1 Timbal should be 8');
    console.assert(deriveRelevantNeeds(planningItemsById.lunchAlt1).find((need) => need.id === 'grovPate')?.count === 4, 'Alt 1 Grov paté should be 4');
    console.assert(deriveRelevantNeeds(planningItemsById.lunchAlt1).find((need) => need.id === 'laktosfri') === undefined, 'Alt 1 should not include Laktosfri');
    console.assert(deriveRelevantNeeds(planningItemsById.lunchAlt2).find((need) => need.id === 'laktosfri')?.count === 7, 'Alt 2 Laktosfri should be 7');
    console.assert(deriveAffectedCount(planningItemsById.lunchAlt1, new Set(['timbal'])) === 8, 'Alt 1 Timbal affected should be 8');
    console.assert(deriveAffectedCount(planningItemsById.lunchAlt1, new Set(['grovPate'])) === 4, 'Alt 1 Grov paté affected should be 4');
    console.assert(deriveAffectedCount(planningItemsById.lunchAlt1, new Set(['timbal', 'grovPate'])) === 11, 'Alt 1 Timbal + Grov paté affected should be 11');
    console.assert(deriveAffectedCount(planningItemsById.lunchAlt2, new Set(['laktosfri'])) === 7, 'Alt 2 Laktosfri affected should be 7');
    console.assert(getPlannedCount() === 0, 'Initial planned count should be 0');
